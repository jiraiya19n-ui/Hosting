<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NEON NEXUS - Gestor Multiusuario</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
    <style>
        :root { --bg-dark: #08090f; --card-bg: rgba(18, 22, 36, 0.75); --neon-cyan: #00f3ff; --neon-pink: #ff007f; --neon-green: #00ff66; --neon-purple: #9d00ff; --text-main: #e2e8f0; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Rajdhani', sans-serif; }
        body { background-color: var(--bg-dark); color: var(--text-main); min-height: 100vh; display: flex; background-image: radial-gradient(circle at 15% 20%, rgba(157, 0, 255, 0.15) 0%, transparent 40%), radial-gradient(circle at 85% 80%, rgba(0, 243, 255, 0.15) 0%, transparent 40%); background-attachment: fixed; }
        aside { width: 260px; background: rgba(10, 12, 20, 0.85); border-right: 1px solid rgba(0, 243, 255, 0.2); backdrop-filter: blur(12px); padding: 2rem 1.5rem; display: flex; flex-direction: column; gap: 2rem; flex-shrink: 0; }
        .logo { font-family: 'Orbitron', sans-serif; font-size: 1.4rem; font-weight: 700; color: var(--neon-cyan); text-shadow: 0 0 10px var(--neon-cyan); letter-spacing: 2px; }
        .stats-card { background: rgba(255, 255, 255, 0.03); border: 1px solid rgba(255, 0, 127, 0.3); border-radius: 12px; padding: 1rem; box-shadow: 0 0 15px rgba(255, 0, 127, 0.1); }
        .stats-card h4 { font-size: 0.85rem; text-transform: uppercase; color: #8a99ad; margin-bottom: 0.5rem; }
        .xp-bar { width: 100%; height: 8px; background: #1a1d2d; border-radius: 4px; overflow: hidden; margin-top: 0.5rem; }
        .xp-progress { width: 0%; height: 100%; background: linear-gradient(90deg, var(--neon-pink), var(--neon-purple)); box-shadow: 0 0 8px var(--neon-pink); transition: width 0.4s ease; }
        main { flex: 1; padding: 2rem; display: flex; flex-direction: column; gap: 1.5rem; height: 100vh; overflow-y: auto; }
        header { display: flex; justify-content: space-between; align-items: center; }
        .task-input-container { display: flex; gap: 1rem; background: var(--card-bg); padding: 0.75rem 1rem; border-radius: 12px; border: 1px solid rgba(0, 243, 255, 0.3); box-shadow: 0 0 15px rgba(0, 243, 255, 0.1); }
        input, select, button { background: transparent; border: none; color: #fff; font-size: 1rem; outline: none; }
        input[type="text"] { flex: 1; }
        select option { background: #0d0f17; color: #fff; }
        .btn-add { background: var(--neon-cyan); color: #000; font-weight: 700; padding: 0.5rem 1.5rem; border-radius: 8px; cursor: pointer; transition: all 0.3s ease; box-shadow: 0 0 10px var(--neon-cyan); }
        .btn-add:hover { transform: translateY(-2px); box-shadow: 0 0 20px var(--neon-cyan); }
        .nexus-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 1.5rem; flex: 1; align-content: start; }
        .quadrant { background: var(--card-bg); border-radius: 16px; padding: 1.25rem; backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.08); display: flex; flex-direction: column; gap: 1rem; position: relative; max-height: 380px; }
        .quadrant::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px; border-radius: 16px 16px 0 0; }
        .q-critical::before { background: var(--neon-pink); box-shadow: 0 0 10px var(--neon-pink); }
        .q-focus::before { background: var(--neon-cyan); box-shadow: 0 0 10px var(--neon-cyan); }
        .q-flow::before { background: var(--neon-green); box-shadow: 0 0 10px var(--neon-green); }
        .q-low::before { background: var(--neon-purple); box-shadow: 0 0 10px var(--neon-purple); }
        .quadrant h3 { font-family: 'Orbitron', sans-serif; font-size: 1.05rem; display: flex; align-items: center; justify-content: space-between; }
        .task-list { display: flex; flex-direction: column; gap: 0.75rem; overflow-y: auto; padding-right: 5px; }
        .task-list::-webkit-scrollbar { width: 4px; }
        .task-list::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.2); border-radius: 4px; }
        .task-card { background: rgba(255, 255, 255, 0.03); border: 1px solid rgba(255, 255, 255, 0.05); padding: 0.8rem 1rem; border-radius: 10px; display: flex; align-items: center; justify-content: space-between; gap: 0.5rem; word-break: break-word; transition: all 0.2s ease; }
        .task-card:hover { background: rgba(255, 255, 255, 0.07); }
        .task-card.completed { opacity: 0.4; text-decoration: line-through; }
        .task-actions { display: flex; gap: 0.5rem; flex-shrink: 0; }
        .btn-action { cursor: pointer; opacity: 0.7; transition: opacity 0.2s; }
        .btn-action:hover { opacity: 1; }
    </style>
</head>
<body>

    <aside>
        <div class="logo">⚡ NEXUS PRO</div>
        <div class="stats-card">
            <h4>Nivel de Enfoque Global</h4>
            <h2 id="user-level" style="color: var(--neon-pink); font-family: Orbitron;">NIVEL 1</h2>
            <div class="xp-bar">
                <div class="xp-progress" id="xp-progress"></div>
            </div>
            <p id="xp-text" style="font-size: 0.8rem; margin-top: 0.5rem; color: #64748b;">Conectando...</p>
        </div>
        <div class="stats-card" style="border-color: rgba(0, 243, 255, 0.3);">
            <h4>Tareas Finalizadas</h4>
            <h3 id="completed-counter" style="color: var(--neon-cyan);">0 Completadas</h3>
        </div>
    </aside>

    <main>
        <header>
            <h1 style="font-family: Orbitron; letter-spacing: 1px;">Tablero Sincronizado</h1>
            <span style="color: var(--neon-green); font-size: 0.9rem;">🟢 Online</span>
        </header>

        <form class="task-input-container" id="taskForm">
            <input type="text" id="taskText" placeholder="Escribe un nuevo objetivo..." required>
            <select id="taskZone">
                <option value="critical">🔥 Crítico</option>
                <option value="focus">🎯 Enfoque</option>
                <option value="flow">⚡ Flujo</option>
                <option value="low">📥 Mantenimiento</option>
            </select>
            <button type="submit" class="btn-add">+ Añadir</button>
        </form>

        <div class="nexus-grid">
            <div class="quadrant q-critical">
                <h3 style="color: var(--neon-pink);">🔥 Crítico <span id="count-critical">0</span></h3>
                <div class="task-list" id="list-critical"></div>
            </div>
            <div class="quadrant q-focus">
                <h3 style="color: var(--neon-cyan);">🎯 Enfoque <span id="count-focus">0</span></h3>
                <div class="task-list" id="list-focus"></div>
            </div>
            <div class="quadrant q-flow">
                <h3 style="color: var(--neon-green);">⚡ Flujo <span id="count-flow">0</span></h3>
                <div class="task-list" id="list-flow"></div>
            </div>
            <div class="quadrant q-low">
                <h3 style="color: var(--neon-purple);">📥 Rutina <span id="count-low">0</span></h3>
                <div class="task-list" id="list-low"></div>
            </div>
        </div>
    </main>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, addDoc, onSnapshot, deleteDoc, doc, updateDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        // Tus credenciales vinculadas directamente
        const firebaseConfig = {
            apiKey: "AIzaSyDsZJy-THfnrZ-AMsRhzBjoGQ0QjrdDbOk",
            authDomain: "nexustasks-57299.firebaseapp.com",
            projectId: "nexustasks-57299",
            storageBucket: "nexustasks-57299.firebasestorage.app",
            messagingSenderId: "934372929182",
            appId: "1:934372929182:web:03b450298d2344522d158f"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const tasksRef = collection(db, "nexus_tasks");

        document.getElementById("taskForm").addEventListener("submit", async (e) => {
            e.preventDefault();
            const input = document.getElementById("taskText");
            const zone = document.getElementById("taskZone").value;
            
            if (input.value.trim() !== "") {
                await addDoc(tasksRef, {
                    text: input.value.trim(),
                    zone: zone,
                    completed: false,
                    timestamp: Date.now()
                });
                input.value = "";
            }
        });

        onSnapshot(tasksRef, (snapshot) => {
            const zones = ['critical', 'focus', 'flow', 'low'];
            zones.forEach(z => {
                document.getElementById(`list-${z}`).innerHTML = '';
                document.getElementById(`count-${z}`).innerText = '0';
            });

            let completedTotal = 0;

            snapshot.forEach((docSnap) => {
                const task = docSnap.data();
                const id = docSnap.id;
                
                if (task.completed) completedTotal++;
                
                const countEl = document.getElementById(`count-${task.zone}`);
                if (countEl) countEl.innerText = parseInt(countEl.innerText) + 1;

                const card = document.createElement('div');
                card.className = `task-card ${task.completed ? 'completed' : ''}`;
                card.innerHTML = `
                    <span>${escapeHTML(task.text)}</span>
                    <div class="task-actions">
                        <span class="btn-action btn-toggle" data-id="${id}" data-status="${task.completed}">${task.completed ? '↩️' : '✅'}</span>
                        <span class="btn-action btn-delete" data-id="${id}">🗑️</span>
                    </div>
                `;
                
                const listEl = document.getElementById(`list-${task.zone}`);
                if (listEl) listEl.appendChild(card);
            });

            const totalXP = completedTotal * 25;
            const level = Math.floor(totalXP / 100) + 1;
            const currentXP = totalXP % 100;

            document.getElementById('user-level').innerText = `NIVEL ${level}`;
            document.getElementById('xp-progress').style.width = `${currentXP}%`;
            document.getElementById('xp-text').innerText = `${currentXP} / 100 XP para subir`;
            document.getElementById('completed-counter').innerText = `${completedTotal} Completadas`;

            document.querySelectorAll('.btn-toggle').forEach(btn => {
                btn.addEventListener('click', async (e) => {
                    const id = e.target.getAttribute('data-id');
                    const isCompleted = e.target.getAttribute('data-status') === 'true';
                    await updateDoc(doc(db, "nexus_tasks", id), { completed: !isCompleted });
                });
            });

            document.querySelectorAll('.btn-delete').forEach(btn => {
                btn.addEventListener('click', async (e) => {
                    const id = e.target.getAttribute('data-id');
                    await deleteDoc(doc(db, "nexus_tasks", id));
                });
            });
        });

        function escapeHTML(str) {
            return str.replace(/[&<>'"]/g, 
                tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag)
            );
        }
    </script>
</body>
</html>
